  <script>
    window.trackMpAddToCart = function (product, quantity) {
      window._mp.waitUntil(function () { return window._mp && window._mp.eedlInstance; }, 15000, 100, function () {
        window._mp.safeExecute('evAddToCart', function () {
          var cartId = window.sessionStorage.getItem('mp_cart_id');
          if (!cartId) {
            cartId = 'cart_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
            window.sessionStorage.setItem('mp_cart_id', cartId);
          }

          var itemObj = {
            item_id: String(product.id),
            item_name: product.name,
            item_sku: String(product.sku || product.id),
            variant_id: product.variant || undefined,
            index: 0,
            price: Number(product.price),
            quantity: Number(quantity || 1),
            item_brand: product.brand || 'Luma Scents',
            item_category: product.category || undefined,
            options: {
              volume: product.volume,
            },
          };

          var payload = {
            currency: 'INR',
            cart_id: cartId,
            value: Number(product.price),
            items: [itemObj],
            ev_source: 'gtm',
          };

          eedl('add_to_cart', payload);
        })();
      });
    };

    window.trackMpViewItem = function (product) {
      window._mp.waitUntil(function () { return window._mp && window._mp.eedlInstance; }, 15000, 100, function () {
        window._mp.safeExecute('evViewItem', function () {
          var itemObj = {
            item_id: String(product.id),
            item_name: product.name,
            item_sku: String(product.sku || product.id),
            variant_id: product.variant || undefined,
            index: 0,
            price: Number(product.price),
            quantity: 1,
            item_brand: product.brand || 'Luma Scents',
            item_category: product.category || undefined,
            options: {
              volume: product.volume,
            },
          };

          var payload = {
            currency: 'INR',
            value: Number(product.price),
            items: [itemObj],
            ev_source: 'gtm',
          };

          eedl('view_item', payload);
        })();
      });
    };

    window.trackMpViewCart = function (items, totalValue) {
      window._mp.waitUntil(function () { return window._mp && window._mp.eedlInstance; }, 15000, 100, function () {
        window._mp.safeExecute('evViewCart', function () {
          var cartId = window.sessionStorage.getItem('mp_cart_id');
          if (!cartId) {
            cartId = 'cart_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
            window.sessionStorage.setItem('mp_cart_id', cartId);
          }

          var itemsList = (items || []).map(function (cartItem, idx) {
            var prod = cartItem.product || cartItem;
            return {
              item_id: String(prod.id),
              item_name: prod.name,
              item_sku: String(prod.sku || prod.id),
              variant_id: prod.variant || undefined,
              index: idx,
              price: Number(prod.price),
              quantity: Number(cartItem.quantity || 1),
              item_brand: prod.brand || 'Luma Scents',
              item_category: prod.category || undefined,
              options: {
                volume: prod.volume,
              },
            };
          });

          var calculatedTotal = typeof totalValue === 'number'
            ? totalValue
            : itemsList.reduce(function (acc, item) { return acc + (item.price * item.quantity); }, 0);

          var payload = {
            currency: 'INR',
            cart_id: cartId,
            value: Number(calculatedTotal),
            items: itemsList,
            ev_source: 'gtm',
          };

          eedl('view_cart', payload);
        })();
      });
    };
  </script>
